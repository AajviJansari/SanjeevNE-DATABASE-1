  <!-- Main Content -->
  <main class="page">
    <div class="search-box">
      <h1> NE-States</h1>

      <form id="stateForm">
  <label for="neStates">Select State:</label>
  <select id="neStates" name="neStates" required>
    <option value="" disabled selected>Select a State</option>
    <option value="arunachal">Arunachal Pradesh</option>
    <option value="assam">Assam</option>
    <option value="manipur">Manipur</option>
    <option value="meghalaya">Meghalaya</option>
    <option value="mizoram">Mizoram</option>
    <option value="nagaland">Nagaland</option>
    <option value="sikkim">Sikkim</option>
    <option value="tripura">Tripura</option>
  </select>
  <button type="submit">Submit</button>
</form>

<script>
document.getElementById("stateForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  const selectedState = document.getElementById("neStates").value;

  try {
    const response = await fetch(`/state/${selectedState}`);
    const data = await response.json();

    const resultDiv = document.createElement("div");
    if (data.error) {
      resultDiv.innerHTML = `<p>${data.error}</p>`;
    } else {
      resultDiv.innerHTML = `<h2>Plants of ${selectedState}</h2><ul>${data.plants
        .map((p) => `<li>${p}</li>`)
        .join("")}</ul>`;
    }

    document.querySelector(".page").appendChild(resultDiv);
  } catch (err) {
    console.error(err);
  }
});
</script>
